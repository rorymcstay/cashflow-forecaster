[project]
name = "budgeting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.0.0",
    "nicegui>=3.16.0",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "plotly>=7.0.0",
    "polars>=1.43.2",
    "pyside6>=6.11.1",
    "python-dateutil>=2.9.0.post0",
    "sqlalchemy>=2.0.51",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "ty>=0.0.66",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
